<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato | Soutec Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap');
        html, body { height: 100%; margin: 0; background-color: #020b14; color: white; font-family: 'Rajdhani', sans-serif; overflow-x: hidden; }
        body { background: radial-gradient(circle at center, #0a192f 0%, #020b14 100%); display: flex; flex-direction: column; }
        #particles-js { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.4; }
        .font-quantum { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(2, 15, 30, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(0, 242, 255, 0.1); }
        .text-glow { filter: drop-shadow(0 0 10px rgba(0, 242, 255, 0.5)); }
    </style>
</head>
<body>
    <div id="particles-js"></div>

    <nav class="p-4 md:p-6 flex justify-between items-center max-w-7xl mx-auto w-full relative z-50">
        <div class="flex items-center gap-3">
            <a href="index.html" class="flex items-center gap-3">
                <div class="w-10 h-10 glass rounded-xl flex items-center justify-center bg-cyan-500/10 shadow-[0_0_15px_rgba(0,242,255,0.4)]">
                    <span class="text-cyan-400 font-bold font-quantum text-xl">S</span>
                </div>
                <div class="font-quantum font-bold text-xl tracking-tighter">
                    SOUTEC <span class="text-[8px] block text-orange-400 tracking-[3px] uppercase leading-none">Digital Soluções</span>
                </div>
            </a>
        </div>
        <div class="hidden md:flex gap-8 text-[10px] uppercase tracking-[2px] font-bold">
            <a href="index.html" class="hover:text-cyan-400 transition">Início</a>
            <a href="sistemas.html" class="hover:text-cyan-400 transition">Sistemas</a>
            <a href="#" class="hover:text-cyan-400 transition">IA & Dev</a>
            <a href="contato.html" class="text-cyan-400 border-b border-cyan-400">Contato</a>
        </div>
    </nav>

    <main class="flex-grow flex flex-col items-center justify-center px-6 relative z-10 py-20">
        <h1 class="text-4xl md:text-6xl font-quantum font-bold mb-6 text-glow text-center">Conecte-se ao Futuro</h1>
        <p class="text-orange-400 font-light tracking-[5px] uppercase text-center mb-10">Pronto para a Transformação Digital?</p>


<div class="w-full max-w-lg glass p-8 rounded-3xl border border-cyan-500/20 shadow-[0_0_50px_rgba(0,242,255,0.05)] relative z-20">
    <form action="#" method="POST" class="flex flex-col gap-5">
        
        <div class="relative group">
            <label class="text-[10px] uppercase tracking-[3px] text-cyan-400 font-bold ml-2 mb-1 block">Identificação</label>
            <input type="text" placeholder="Seu nome ou empresa" 
                class="w-full bg-white/5 border border-white/10 rounded-xl py-3 px-4 text-white outline-none focus:border-cyan-400 focus:shadow-[0_0_15px_rgba(0,242,255,0.2)] transition-all duration-300 placeholder:text-gray-600">
        </div>

        <div class="relative group">
            <label class="text-[10px] uppercase tracking-[3px] text-purple-400 font-bold ml-2 mb-1 block">Canal de Retorno</label>
            <input type="email" placeholder="seu@email.com" 
                class="w-full bg-white/5 border border-white/10 rounded-xl py-3 px-4 text-white outline-none focus:border-purple-500 focus:shadow-[0_0_15px_rgba(188,19,254,0.2)] transition-all duration-300 placeholder:text-gray-600">
        </div>

        <div class="relative group">
            <label class="text-[10px] uppercase tracking-[3px] text-orange-400 font-bold ml-2 mb-1 block">Briefing do Projeto</label>
            <textarea rows="4" placeholder="Descreva sua necessidade técnica..." 
                class="w-full bg-white/5 border border-white/10 rounded-xl py-3 px-4 text-white outline-none focus:border-orange-400 focus:shadow-[0_0_15px_rgba(251,146,60,0.2)] transition-all duration-300 placeholder:text-gray-600 resize-none"></textarea>
        </div>

        <button type="submit" 
            class="mt-4 bg-cyan-500 hover:bg-cyan-400 text-black font-quantum font-bold py-4 rounded-xl shadow-[0_0_20px_rgba(0,242,255,0.4)] hover:shadow-[0_0_30px_rgba(0,242,255,0.6)] transform hover:scale-[1.02] transition-all duration-300 flex items-center justify-center gap-3 group">
                        INICIALIZAR PROTOCOLO
                        <svg class="ml-2 w-5 h-5 transform group-hover:-translate-x-1 group-hover:-translate-y-1 transition-transform" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                            <path d="M2 21l21-9L2 3v7l15 2-15 2v6z" />
                        </svg>
        </button>
        
    </form>
</div>














        </main>

    <footer class="flex flex-col items-center justify-end pb-8 gap-4 relative z-50">
        <div class="flex gap-6 text-xl">
            <a href="#" class="text-gray-500 hover:text-cyan-400 transition">ig</a>
            <a href="#" class="text-gray-500 hover:text-cyan-400 transition">wa</a>
        </div>
        <p class="text-[9px] text-gray-600 tracking-[4px] uppercase font-medium">© 2026 Soutec Digital Solutions</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        particlesJS('particles-js', {
            particles: {
                number: { value: 40, density: { enable: true, value_area: 800 } },
                color: { value: '#bc13fe' }, /* Partículas roxas para diferenciar contato */
                line_linked: { enable: true, distance: 150, color: '#bc13fe', opacity: 0.1, width: 1 },
                move: { enable: true, speed: 1 }
            }
        });
    </script>
</body>
</html>
